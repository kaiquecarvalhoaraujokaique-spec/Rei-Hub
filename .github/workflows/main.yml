local vp = workspace.CurrentCamera.ViewportSize
local larguraP = math.clamp(C.LarguraPainel, 280, vp.X - 40)
local alturaP = math.clamp(C.AlturaPainel, 380, vp.Y - 40)
local aberto = false

function abrirPainel()
    if aberto then return end
    aberto = true

    crown.Visible = false
    painel.Visible = true
    painel.Size = UDim2.new(0, 0, 0, 0)

    tween(painel, 0.45, {
        Size = UDim2.new(0, larguraP, 0, alturaP)
    }, Enum.EasingStyle.Back, Enum.EasingDirection.Out)

    task.spawn(function()
        task.wait(0.2)
        tween(titulo, 0.3, { TextTransparency = 0 })
        tween(avatar, 0.3, { ImageTransparency = 0 })
        task.wait(0.07)
        tween(nomeLabel, 0.3, { TextTransparency = 0 })
        tween(idLabel, 0.3, { TextTransparency = 0 })
        task.wait(0.07)
        for _, linha in pairs(linhas) do
            linha.Mostrar()
            task.wait(0.07)
        end
    end)
end

function fecharPainel()
    if not aberto then return end
    aberto = false

    tween(titulo, 0.15, { TextTransparency = 1 })
    tween(avatar, 0.15, { ImageTransparency = 1 })
    tween(nomeLabel, 0.15, { TextTransparency = 1 })
    tween(idLabel, 0.15, { TextTransparency = 1 })
    for _, linha in pairs(linhas) do
        tween(linha.Linha, 0.15, { BackgroundTransparency = 1 })
    end

    tween(painel, 0.28, {
        Size = UDim2.new(0, 0, 0, 0)
    }, Enum.EasingStyle.Quart, Enum.EasingDirection.In)

    task.delay(0.28, function()
        painel.Visible = false
        crown.Visible = true
        crown.Size = UDim2.new(0, 0, 0, 0)
        tween(crown, 0.3, { Size = UDim2.new(0, 60, 0, 60) }, Enum.EasingStyle.Back)
    end)
end

crown.MouseButton1Click:Connect(function()
    if not moveu then
        if not painel.Visible then
            abrirPainel()
        end
    end
end)

botaoX.MouseButton1Click:Connect(fecharPainel)

notificar("Rei Hub carregado! Arraste a coroa 👑")
