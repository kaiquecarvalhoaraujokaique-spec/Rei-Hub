local arrastando = false
local dragInicio = nil
local posInicial = nil
local moveu = false

crown.InputBegan:Connect(function(input)
    if input.UserInputType == Enum.UserInputType.MouseButton1
    or input.UserInputType == Enum.UserInputType.Touch then
        arrastando = true
        moveu = false
        dragInicio = input.Position
        posInicial = crown.Position
    end
end)

crown.InputChanged:Connect(function(input)
    if not arrastando then return end
    if input.UserInputType ~= Enum.UserInputType.MouseMovement
    and input.UserInputType ~= Enum.UserInputType.Touch then return end

    local delta = input.Position - dragInicio
    if math.abs(delta.X) > 4 or math.abs(delta.Y) > 4 then
        moveu = true
    end

    crown.Position = UDim2.new(
        posInicial.X.Scale,
        posInicial.X.Offset + delta.X,
        posInicial.Y.Scale,
        posInicial.Y.Offset + delta.Y
    )
end)

crown.InputEnded:Connect(function(input)
    if input.UserInputType == Enum.UserInputType.MouseButton1
    or input.UserInputType == Enum.UserInputType.Touch then
        arrastando = false
    end
end)

