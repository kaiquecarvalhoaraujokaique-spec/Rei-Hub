local function criarToggle(ordem, tituloTexto, descTexto, estadoInicial, callback)
    local linha = Instance.new("Frame")
    linha.Name = "Linha"
    linha.BackgroundColor3 = C.Row
    linha.BorderSizePixel = 0
    linha.Size = UDim2.new(1, -4, 0, 66)
    linha.LayoutOrder = ordem
    linha.BackgroundTransparency = 1
    linha.Parent = scroll
    arredondar(linha, UDim.new(0, 12))
    borda(linha, Color3.fromRGB(15, 15, 18), 1.5)

    local tituloL = Instance.new("TextLabel")
    tituloL.BackgroundTransparency = 1
    tituloL.Size = UDim2.new(1, -90, 0, 22)
    tituloL.Position = UDim2.new(0, 12, 0, 10)
    tituloL.Font = Enum.Font.GothamSemibold
    tituloL.Text = tituloTexto
    tituloL.TextColor3 = C.Texto
    tituloL.TextSize = 15
    tituloL.TextXAlignment = Enum.TextXAlignment.Left
    tituloL.Parent = linha

    local descL = Instance.new("TextLabel")
    descL.BackgroundTransparency = 1
    descL.Size = UDim2.new(1, -90, 0, 28)
    descL.Position = UDim2.new(0, 12, 0, 32)
    descL.Font = Enum.Font.Gotham
    descL.Text = descTexto
    descL.TextColor3 = C.TextoSub
    descL.TextSize = 11
    descL.TextWrapped = true
    descL.TextXAlignment = Enum.TextXAlignment.Left
    descL.Parent = linha

    local trilho = Instance.new("TextButton")
    trilho.Name = "Trilho"
    trilho.AnchorPoint = Vector2.new(1, 0.5)
    trilho.Position = UDim2.new(1, -12, 0.5, 0)
    trilho.Size = UDim2.new(0, 52, 0, 28)
    trilho.BackgroundColor3 = estadoInicial and C.ToggleOn or C.ToggleOff
    trilho.Text = ""
    trilho.BorderSizePixel = 0
    trilho.AutoButtonColor = false
    trilho.Parent = linha
    arredondar(trilho, UDim.new(1, 0))

    local bolinha = Instance.new("Frame")
    bolinha.Name = "Bolinha"
    bolinha.Size = UDim2.new(0, 22, 0, 22)
    if estadoInicial then
        bolinha.Position = UDim2.new(1, -24, 0.5, -11)
    else
        bolinha.Position = UDim2.new(0, 2, 0.5, -11)
    end
    bolinha.BackgroundColor3 = Color3.new(1, 1, 1)
    bolinha.BorderSizePixel = 0
    bolinha.Parent = trilho
    arredondar(bolinha, UDim.new(1, 0))

    local estado = estadoInicial

    local function atualizarVisual(ligado)
        local corAlvo = ligado and C.ToggleOn or C.ToggleOff
        local posAlvo
        if ligado then
            posAlvo = UDim2.new(1, -24, 0.5, -11)
        else
            posAlvo = UDim2.new(0, 2, 0.5, -11)
        end
        tween(trilho, 0.22, { BackgroundColor3 = corAlvo })
        tween(bolinha, 0.22, { Position = posAlvo }, Enum.EasingStyle.Quint)
    end

    trilho.MouseButton1Click:Connect(function()
        estado = not estado
        atualizarVisual(estado)
        if callback then
            callback(estado)
        end
    end)

    return {
        Linha = linha,
        Set = function(novo)
            estado = novo
            atualizarVisual(novo)
        end,
        Mostrar = function()
            tween(linha, 0.35, { BackgroundTransparency = 0 })
        end,
    }
end

local function criarSlider(ordem, tituloTexto, descTexto, minV, maxV, padrao, callback)
    local linha = Instance.new("Frame")
    linha.Name = "Slider"
    linha.BackgroundColor3 = C.Row
    linha.BorderSizePixel = 0
    linha.Size = UDim2.new(1, -4, 0, 96)
    linha.LayoutOrder = ordem
    linha.BackgroundTransparency = 1
    linha.Parent = scroll
    arredondar(linha, UDim.new(0, 12))
    borda(linha, Color3.fromRGB(15, 15, 18), 1.5)

    local tituloL = Instance.new("TextLabel")
    tituloL.BackgroundTransparency = 1
    tituloL.Size = UDim2.new(1, -90, 0, 22)
    tituloL.Position = UDim2.new(0, 12, 0, 10)
    tituloL.Font = Enum.Font.GothamSemibold
    tituloL.Text = tituloTexto
    tituloL.TextColor3 = C.Texto
    tituloL.TextSize = 15
    tituloL.TextXAlignment = Enum.TextXAlignment.Left
    tituloL.Parent = linha

    local descL = Instance.new("TextLabel")
    descL.BackgroundTransparency = 1
    descL.Size = UDim2.new(1, -90, 0, 20)
    descL.Position = UDim2.new(0, 12, 0, 32)
    descL.Font = Enum.Font.Gotham
    descL.Text = descTexto
    descL.TextColor3 = C.TextoSub
    descL.TextSize = 11
    descL.TextXAlignment = Enum.TextXAlignment.Left
    descL.Parent = linha

    local valorL = Instance.new("TextLabel")
    valorL.BackgroundTransparency = 1
    valorL.Size = UDim2.new(0, 60, 0, 22)
    valorL.Position = UDim2.new(1, -70, 0, 10)
    valorL.Font = Enum.Font.GothamBold
    valorL.Text = "x" .. padrao
    valorL.TextColor3 = C.Accent
    valorL.TextSize = 16
    valorL.TextXAlignment = Enum.TextXAlignment.Right
    valorL.Parent = linha

    local barra = Instance.new("Frame")
    barra.Name = "Barra"
    barra.BackgroundColor3 = Color3.fromRGB(60, 60, 66)
    barra.BorderSizePixel = 0
    barra.Size = UDim2.new(1, -90, 0, 10)
    barra.Position = UDim2.new(0, 12, 0, 68)
    barra.Parent = linha
    arredondar(barra, UDim.new(1, 0))

    local preenchido = Instance.new("Frame")
    preenchido.Name = "Preenchido"
    preenchido.BackgroundColor3 = C.ToggleOn
    preenchido.BorderSizePixel = 0
    local pctInicial = (padrao - minV) / (maxV - minV)
    preenchido.Size = UDim2.new(pctInicial, 0, 1, 0)
    preenchido.Parent = barra
    arredondar(preenchido, UDim.new(1, 0))

    local botaoS = Instance.new("Frame")
    botaoS.Name = "BotaoS"
    botaoS.AnchorPoint = Vector2.new(0.5, 0.5)
    botaoS.BackgroundColor3 = Color3.new(1, 1, 1)
    botaoS.BorderSizePixel = 0
    botaoS.Size = UDim2.new(0, 20, 0, 20)
    botaoS.Position = UDim2.new(pctInicial, 0, 0.5, 0)
    botaoS.Parent = barra
    arredondar(botaoS, UDim.new(1, 0))

    local valorAtual = padrao
    local arrastandoS = false

    local function definirValor(v)
        v = math.floor(v + 0.5)
        if v < 1 then v = 1 end
        if v > maxV then v = maxV end
        valorAtual = v
        local pct = (v - minV) / (maxV - minV)
        tween(preenchido, 0.15, { Size = UDim2.new(pct, 0, 1, 0) })
        tween(botaoS, 0.15, { Position = UDim2.new(pct, 0, 0.5, 0) })
        valorL.Text = "x" .. v
        if callback then callback(v) end
    end

    local function inputParaValor(input)
        local relX = input.Position.X - barra.AbsolutePosition.X
        local pct = math.clamp(relX / barra.AbsoluteSize.X, 0, 1)
        definirValor(minV + pct * (maxV - minV))
    end

    barra.InputBegan:Connect(function(input)
        if input.UserInputType == Enum.UserInputType.MouseButton1
        or input.UserInputType == Enum.UserInputType.Touch then
            arrastandoS = true
            inputParaValor(input)
        end
    end)

    barra.InputChanged:Connect(function(input)
        if not arrastandoS then return end
        if input.UserInputType == Enum.UserInputType.MouseMovement
        or input.UserInputType == Enum.UserInputType.Touch then
            inputParaValor(input)
        end
    end)

    UserInput.InputEnded:Connect(function(input)
        if input.UserInputType == Enum.UserInputType.MouseButton1
        or input.UserInputType == Enum.UserInputType.Touch then
            arrastandoS = false
        end
    end)

    return {
        Linha = linha,
        Get = function() return valorAtual end,
        Mostrar = function()
            tween(linha, 0.35, { BackgroundTransparency = 0 })
        end,
    }
end

local invisAtivo = false
local invisConn = nil
local partesSalvas = {}

local function aplicarInvisibilidade(ligar)
    invisAtivo = ligar
    local char = LP.Character
    if not char then return end

    for _, obj in ipairs(char:GetDescendants()) do
        if obj:IsA("BasePart") or obj:IsA("Decal") then
            if ligar then
                if partesSalvas[obj] == nil then
                    partesSalvas[obj] = obj.Transparency
                end
                obj.Transparency = 1
            else
                obj.Transparency = partesSalvas[obj] or 0
            end
        elseif obj:IsA("BillboardGui") or obj:IsA("TextLabel")
            or obj:IsA("TextButton") or obj:IsA("ImageLabel") then
            if ligar then
                obj:SetAttribute("ReiVis", obj.Visible)
                obj.Visible = false
            else
                obj.Visible = obj:GetAttribute("ReiVis") ~= false
            end
        elseif obj:IsA("ParticleEmitter") or obj:IsA("Trail")
            or obj:IsA("Beam") or obj:IsA("Fire") or obj:IsA("Smoke")
            or obj:IsA("Sparkles") or obj:IsA("Highlight") then
            if ligar then
                obj:SetAttribute("ReiEnabled", obj.Enabled)
                obj.Enabled = false
            else
                obj.Enabled = obj:GetAttribute("ReiEnabled") ~= false
            end
        elseif obj:IsA("PointLight") or obj:IsA("SpotLight")
            or obj:IsA("SurfaceLight") then
            if ligar then
                obj:SetAttribute("ReiEnabled", obj.Enabled)
                obj.Enabled = false
            else
                obj.Enabled = obj:GetAttribute("ReiEnabled") ~= false
            end
        end
    end

    if invisConn then
        invisConn:Disconnect()
        invisConn = nil
    end

    if ligar then
        invisConn = RunService.RenderStepped:Connect(function()
            local c = LP.Character
            if not c then return end
            for _, obj in ipairs(c:GetDescendants()) do
                if obj:IsA("BasePart") then
                    obj.LocalTransparencyModifier = 0
                end
            end
        end)
    end
end

LP.CharacterAdded:Connect(function()
    task.wait(0.5)
    if invisAtivo then
        aplicarInvisibilidade(true)
    end
end)

local bossesCongelados = {}
local freezeConn = nil

local function ehBoss(obj)
    if not obj:IsA("Model") then return false end
    if obj:GetAttribute("IsBoss") == true then return true end
    for _, k in ipairs({"Boss", "Chefe", "BossFinal", "RaidBoss", "Miniboss"}) do
        if string.find(obj.Name, k, 1, true) then
            return true
        end
    end
    return false
end

local function congelarBoss(b)
    if bossesCongelados[b] then return end
    local dados = { hum = nil, ws = 0, jp = 0, ancorados = {} }
    local h = b:FindFirstChildOfClass("Humanoid")
    if h then
        dados.hum = h
        dados.ws = h.WalkSpeed
        dados.jp = h.JumpPower
        h.WalkSpeed = 0
        h.JumpPower = 0
    end
    for _, parte in ipairs(b:GetDescendants()) do
        if parte:IsA("BasePart") and parte.Name == "HumanoidRootPart" then
            dados.ancorados[parte] = parte.Anchored
            parte.Anchored = true
        end
    end
    bossesCongelados[b] = dados
end

local function descongelarBoss(b)
    local dados = bossesCongelados[b]
    if not dados then return end
    if dados.hum and dados.hum.Parent then
        dados.hum.WalkSpeed = dados.ws
        dados.hum.JumpPower = dados.jp
    end
    for parte, eraAncorado in pairs(dados.ancorados) do
        if parte and parte.Parent then
            parte.Anchored = eraAncorado
        end
    end
    bossesCongelados[b] = nil
end

local function aplicarCongelamento(ligar)
    if freezeConn then
        freezeConn:Disconnect()
        freezeConn = nil
    end

    if ligar then
        for _, o in ipairs(workspace:GetDescendants()) do
            if ehBoss(o) then congelarBoss(o) end
        end
        freezeConn = RunService.Heartbeat:Connect(function()
            for _, o in ipairs(workspace:GetDescendants()) do
                if ehBoss(o) then
                    local h = o:FindFirstChildOfClass("Humanoid")
                    if h and h.WalkSpeed ~= 0 then
                        h.WalkSpeed = 0
                        h.JumpPower = 0
                    end
                end
            end
        end)
    else
        for _, o in ipairs(workspace:GetDescendants()) do
            if ehBoss(o) then descongelarBoss(o) end
        end
    end
end

local multiplicador = 1

local function aplicarMultiplicador()
    local stats = LP:FindFirstChild("leaderstats")
    if not stats then return end
    for _, stat in ipairs(stats:GetChildren()) do
        if stat:IsA("IntValue") or stat:IsA("NumberValue") then
            if not stat:GetAttribute("ReiOriginal") then
                stat:SetAttribute("ReiOriginal", stat.Value)
            end
            local orig = stat:GetAttribute("ReiOriginal") or 0
            if orig > 0 then
                stat.Value = orig * multiplicador
            end
        end
    end
end

