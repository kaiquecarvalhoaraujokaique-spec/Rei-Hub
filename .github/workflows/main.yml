}

local function tween(obj, tempo, props, estilo, direcao)
    local info = TweenInfo.new(
        tempo or 0.25,
        estilo or Enum.EasingStyle.Quart,
        direcao or Enum.EasingDirection.Out
    )
    local t = TweenService:Create(obj, info, props)
    t:Play()
    return t
end

local function arredondar(obj, raio)
    local c = Instance.new("UICorner")
    c.CornerRadius = raio or UDim.new(0, 12)
    c.Parent = obj
    return c
end

local function borda(obj, cor, espessura)
    local s = Instance.new("UIStroke")
    s.Color = cor or Color3.new(0, 0, 0)
    s.Thickness = espessura or 2
    s.ApplyStrokeMode = Enum.ApplyStrokeMode.Border
    s.Parent = obj
    return s
end

